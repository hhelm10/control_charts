experiment:
  name: f1v2-surr-c0.5-s47
  description: 'Figure 1 v2: no-mimesis real grid, factor spine'
data:
  total_questions: 50
  questions_per_agent: 4
  n_temporal: 10
  temporal_change_probability: 0.04
agents:
  count: 10
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: false
  answer_policy: firsthand
network:
  topology: full_mesh
simulation:
  max_iterations: 500
  seed: 47
  questions_per_turn: 5
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.5
    decay_mode: multiplicative
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 10
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
