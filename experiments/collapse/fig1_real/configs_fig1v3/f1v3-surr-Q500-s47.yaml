experiment:
  name: f1v3-surr-Q500-s47
  description: 'Figure 1 v3: no-mimesis, env store, budget B=11'
data:
  total_questions: 500
  questions_per_agent: 49
  n_temporal: 10
  temporal_change_probability: 0.04
agents:
  count: 10
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: false
  answer_policy: firsthand
network:
  topology: full_mesh
simulation:
  max_iterations: 500
  seed: 47
  questions_per_turn: 10
  env_queries_per_turn: 1
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
    decay_mode: multiplicative
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 10
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
