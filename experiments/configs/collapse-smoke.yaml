experiment:
  name: collapse-smoke
  description: 'Smoke test for Figure 1 (real system): paper baseline, 20 iterations, cost/latency check'
data:
  total_questions: 50
  questions_per_agent: 8
  n_temporal: 10
  temporal_change_probability: 0.04
agents:
  count: 5
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: true
network:
  topology: full_mesh
simulation:
  max_iterations: 20
  seed: 42
  questions_per_turn: 5
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
    decay_mode: multiplicative
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 10
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
