experiment:
  name: f1v7-surr-E1-s49
  description: 'Figure: WITH mimesis (open grounding), env store, B=11, median-centered
    baseline'
data:
  total_questions: 50
  questions_per_agent: 5
  n_temporal: 0
  temporal_change_probability: 0.0
  lambda_mean: 0.01
  lambda_disp: 1.0
agents:
  count: 10
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: false
  answer_policy: open
network:
  topology: random
  edge_probability: 0.6667
simulation:
  max_iterations: 500
  seed: 49
  questions_per_turn: 10
  env_queries_per_turn: 1
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.2
    decay_mode: multiplicative
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 20
    n_nontemporal_sample: 20
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
