experiment:
  name: pxu2-c0.15-M400-s50
  description: 'uniform selection proxy check, wide probe'
data:
  total_questions: 400
  questions_per_agent: 5
  n_temporal: 0
  temporal_change_probability: 0.0
  lambda_mean: 0.03
  lambda_disp: 1.0
agents:
  count: 10
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: false
  answer_policy: firsthand
network:
  topology: random
  edge_probability: 0.6667
simulation:
  max_iterations: 300
  seed: 50
  questions_per_turn: 8
  env_queries_per_turn: 3
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.15
    decay_mode: multiplicative
    question_selection: uniform
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 100
    n_nontemporal_sample: 100
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
