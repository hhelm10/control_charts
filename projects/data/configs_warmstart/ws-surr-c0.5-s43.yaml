experiment:
  name: ws-surr-c0.5-s43
  description: 'Warm start: all agents seeded with current truth of all questions; T=150'
data:
  total_questions: 50
  questions_per_agent: 5
  n_temporal: 0
  temporal_change_probability: 0.0
  lambda_mean: 0.01
  lambda_disp: 1.0
agents:
  count: 10
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: false
  answer_policy: firsthand
network:
  topology: random
  edge_probability: 0.6667
simulation:
  max_iterations: 150
  seed: 43
  questions_per_turn: 8
  env_queries_per_turn: 3
  warm_start: true
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.5
    decay_mode: multiplicative
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 20
    n_nontemporal_sample: 20
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
