experiment:
  name: f1real-dyn-M400-s854
  description: 'Fig 1(a) real: warm start, M=400, T=60'
data:
  total_questions: 400
  questions_per_agent: 5
  n_temporal: 0
  temporal_change_probability: 0.0
  lambda_mean: 0.03
  lambda_disp: 1.0
agents:
  count: 10
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: true
  answer_policy: firsthand
network:
  topology: random
  edge_probability: 0.6667
simulation:
  max_iterations: 60
  seed: 854
  questions_per_turn: 8
  env_queries_per_turn: 3
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
    decay_mode: multiplicative
    question_selection: uniform
  temporal_kernel:
    enabled: true
    interval: 5
    sample_size: 50
    n_nontemporal_sample: 50
  warm_start: true
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
