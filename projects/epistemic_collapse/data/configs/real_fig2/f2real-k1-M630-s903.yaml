experiment:
  name: f2real-k1-M630-s903
  description: 'Fig 2 real: k=1, M=630, T=100'
data:
  total_questions: 630
  questions_per_agent: 5
  n_temporal: 0
  temporal_change_probability: 0.0
  lambda_mean: 0.03
  lambda_disp: 1.0
agents:
  count: 10
  model: gpt-4o-mini
  retrieval_k: 1
  use_llm: true
  answer_policy: firsthand
network:
  topology: random
  edge_probability: 0.6667
simulation:
  max_iterations: 100
  seed: 903
  questions_per_turn: 8
  env_queries_per_turn: 3
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
    decay_mode: multiplicative
    question_selection: uniform
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 50
    n_nontemporal_sample: 50
    start: 50
  warm_start: false
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
