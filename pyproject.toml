[project]
name = "controlcharts"
version = "0.1.0"
description = "Multi-agent information flow simulation system"
readme = "README.md"
authors = [
    { name = "bstadt", email = "brandonduderstadt@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=3.37.0",
    "h2>=4.0.0",                 # HTTP/2 for the async OpenAI client (agent.py)
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.0",
    "datasets>=2.14.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.10.8",
    # Maps dependencies for TDKPS analysis
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "graspologic>=3.0.0",
    "typing-extensions>=4.0.0",
    # Modal for remote embedding (temporal kernel hook)
    "modal>=0.60.0",
]

[project.optional-dependencies]
setup = [
    "modal>=0.60.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "einops>=0.8.0",
]

[project.scripts]
controlcharts = "controlcharts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlcharts"]
